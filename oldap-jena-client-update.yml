---
# Compatibility entry point; all rollout logic lives in the shared update path.
# Keep explicit image inputs for earlier operator commands. Select one host with -l.
- import_playbook: oldap-jena-update.yml
  vars:
    oldap_update_apply: true
    oldap_update_images:
      api: '{{ oldap_jena_api_image }}'
      tools: '{{ oldap_jena_tools_image }}'
