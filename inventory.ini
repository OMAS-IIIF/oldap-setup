[oldap_test]
rosy ansible_host=rosy.home.org ansible_user=rosenth ansible_python_interpreter=/usr/bin/python3

[oldap_prod]
dhlab-oldap ansible_host=dhlab-oldap.dhlab.unibas.ch ansible_user=rosenth ansible_python_interpreter=/usr/bin/python3

[oldap:children]
oldap_test
oldap_prod

# Common defaults for all OLDAP hosts
[oldap:vars]
graphdb_home=/srv/storage/graphdb
graphdb_init=/opt/oldap/graphdb-init
graphdb_basic_user=admin
graphdb_basic_hash="$2a$14$Y/R6019hH.v8YB5ZonrZDOT8in/L4yK6qr6I/7HKJMh0I4p.F5YFy"
oldap_data=/srv/storage/oldap-data
server_api_url=http://oldap-api:8000
caddy_data=/srv/storage/caddy/data
caddy_conf=/srv/storage/caddy/conf

# Test host specific vars
[oldap_test:vars]
public_api_url=https://api.rosy.home.org
public_app_url=https://app.rosy.home.org
oldap_password_reset_frontend_url=https://app.rosy.home.org
oldap_auth_allowed_origins=https://app.rosy.home.org,https://fasnacht.rosy.home.org,http://app.rosy.home.org,http://fasnacht.rosy.home.org
public_iiif_url=https://iiif.rosy.home.org
public_upload_url=https://upload.rosy.home.org
public_mediaserver_url=https://media.home.org
caddy_mode=dev

# Production host specific vars
[oldap_prod:vars]
fasnachts_data=/srv/storage/fasnachts-data
public_api_url=https://api.oldap.org
public_app_url=https://app.oldap.org
oldap_password_reset_frontend_url=https://app.oldap.org
oldap_auth_allowed_origins=https://app.oldap.org,https://fasnacht.oldap.org
public_iiif_url=https://media.oldap.org
public_upload_url=https://media.oldap.org/upload
public_mediaserver_url=https://media.oldap.org
caddy_mode=prod
caddy_email=lukas.rosenthaler@unibas.ch
