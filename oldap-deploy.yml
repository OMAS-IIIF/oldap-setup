---
- name: Setup OLDAP server
  hosts: oldap
  become: true

  vars:
    # the version numbers to be used for deployment
    oldap_api_tag: "v0.2.20"
    oldap_app_tag: "v0.2.4"
    oldap_tools_tag: "v0.3.10"
    oldap_harvesters_tag: "v0.1.1"
    fasnachts_page_tag: "v0.1.33"
    force_pull: false   # set with -e force_pull=true to always pull images (useful for 'latest' tags)

    deploy_root: /opt/oldap
    compose_dir: "{{ deploy_root }}/compose"
    env_dir: "{{ deploy_root }}/.env"
    oldap_harvesters_root: "{{ oldap_data }}/oldap-harvesters"
    oldap_harvesters_config: "{{ oldap_harvesters_root }}/harvesters.toml"
    oldap_harvesters_secrets: "{{ oldap_harvesters_root }}/secrets"
    oldap_harvesters_logs: "{{ oldap_harvesters_root }}/logs"
    # defaults that you can override at run-time or via group_vars
    # prepare requires an existing running Docker host and stopped application writers.
    oldap_deploy_phase: deploy
    rollback: false     # set with -e rollback=true if you want to roll back
    app_env: "Prod"

  pre_tasks:
    - name: Validate deployment phase
      ansible.builtin.assert:
        that:
          - oldap_deploy_phase in ['deploy', 'prepare', 'activate']
          - not (oldap_deploy_phase in ['prepare', 'activate'] and rollback | bool)
          - oldap_deploy_phase == 'deploy' or oldap_writer_enabled | bool
          - oldap_deploy_phase != 'activate' or not oldap_writer_bootstrap | bool
          - oldap_deploy_phase != 'activate' or oldap_writer_recovery_enabled | bool
        fail_msg: "Preparation/activation require coordination and cannot roll back; activation requires recovery and bootstrap disabled."

    - name: Require quiescent application writers before preparation
      ansible.builtin.include_tasks: tasks/require-stopped-writers.yml
      when: oldap_deploy_phase in ['prepare', 'activate']

    - name: Validate required OLDAP authentication configuration
      ansible.builtin.assert:
        that:
          - (oldap_access_jwt_secret | default('') | string | length) >= 32
          - (oldap_refresh_jwt_secret | default('') | string | length) >= 32
          - (oldap_media_jwt_secret | default('') | string | length) >= 32
          - (oldap_password_reset_jwt_secret | default('') | string | length) >= 32
          - (oldap_import_upload_jwt_secret | default('') | string | length) >= 32
          - (oldap_import_service_jwt_secret | default('') | string | length) >= 32
          - (oldap_import_records_jwt_secret | default('') | string | length) >= 32
          - (oldap_export_service_jwt_secret | default('') | string | length) >= 32
          - (oldap_export_download_jwt_secret | default('') | string | length) >= 32
          - >-
            ([oldap_access_jwt_secret | default(''),
              oldap_refresh_jwt_secret | default(''),
              oldap_media_jwt_secret | default(''),
              oldap_password_reset_jwt_secret | default(''),
              oldap_import_upload_jwt_secret | default(''),
              oldap_import_service_jwt_secret | default(''),
              oldap_import_records_jwt_secret | default(''),
              oldap_export_service_jwt_secret | default(''),
              oldap_export_download_jwt_secret | default('')]
            | unique | length) == 9
          - (oldap_auth_admin_user | default('') | string | length) > 0
          - (oldap_auth_admin_password | default('') | string | length) > 0
          - (oldap_import_service_user | default('') | string | length) > 0
          - (oldap_import_service_password | default('') | string | length) > 0
          - (oldap_export_service_user | default('') | string | length) > 0
          - (oldap_export_service_password | default('') | string | length) > 0
          - (oldap_auth_allowed_origins | default('') | string | length) > 0
          - (oldap_password_reset_frontend_url | default('') | string | length) > 0
          - (oldap_public_app_url | default('') | string | length) > 0
          - (oldap_media_ingest_url | default('') | string | length) > 0
          - >-
            (oldap_media_internal_url | default(oldap_media_ingest_url) | string | length) > 0
          - (oldap_media_export_url | default('') | string | length) > 0
          - (oldap_export_max_archive_bytes | int) >= 1
          - (oldap_export_max_archive_bytes | int) <= 50000000000
          - (oldap_export_ready_retention_hours | int) >= 1
          - (oldap_export_ready_retention_hours | int) <= 744
          - (oldap_export_audit_retention_days | int) >= 1
          - (oldap_export_audit_retention_days | int) <= 3650
          - (oldap_export_max_active_jobs_per_user | int) >= 1
          - (oldap_export_max_active_jobs_total | int) >= (oldap_export_max_active_jobs_per_user | int)
          - (oldap_export_max_active_jobs_total | int) <= 10000
          - (oldap_export_max_reserved_bytes_per_user | int) >= 1
          - (oldap_export_max_reserved_bytes_total | int) >= (oldap_export_max_reserved_bytes_per_user | int)
          - (oldap_export_max_reserved_bytes_total | int) <= 5000000000000
        fail_msg: >-
          Authentication deployment variables are missing or invalid. Supply
          nine distinct JWT secrets of at least 32 bytes plus the OLDAP auth,
          import-service, and export-service credentials through
          auth-secrets.yml or Ansible Vault.
      no_log: true

    - name: Validate production browser refresh compatibility
      ansible.builtin.assert:
        that:
          - >-
            (oldap_app_tag | regex_replace('^v', ''))
            is version('0.2.4', '>=')
        fail_msg: >-
          Production authentication requires a refresh-capable oldap-app image
          (v0.2.4 or newer). Publish that client before the split-token cutover.
      when: inventory_hostname in groups['oldap_prod']

    - name: Validate production cross-site refresh cookie
      ansible.builtin.assert:
        that:
          - oldap_refresh_cookie_secure | bool
          - (oldap_refresh_cookie_samesite | string | lower) == 'none'
        fail_msg: >-
          Production serves fasnacht.digital through api.oldap.org. Its refresh
          cookie must therefore use Secure=true and SameSite=None.
      when: inventory_hostname in groups['oldap_prod']

    - name: Validate SMTP password-reset delivery configuration
      ansible.builtin.assert:
        that:
          - (oldap_password_reset_email_backend | default('console') | lower) == 'smtp'
          - (oldap_password_reset_frontend_url | default('')) == 'https://fasnacht.digital'
          - (oldap_mail_host | default('') | string | length) > 0
          - (oldap_mail_port | int) > 0
          - (oldap_mail_port | int) <= 65535
          - (oldap_mail_from | default('') | string | length) > 0
          - oldap_mail_use_tls | bool
        fail_msg: >-
          Production password reset requires the fasnacht.digital frontend and
          a valid STARTTLS SMTP relay configuration.
      when: inventory_hostname in groups['oldap_prod']

    - name: Validate production ZIP-import integration
      ansible.builtin.assert:
        that:
          - (oldap_public_app_url | default('')) == 'https://fasnacht.digital'
          - (oldap_media_ingest_url | default('')) == 'https://media.oldap.org'
          - (oldap_media_internal_url | default('')) == 'https://media.oldap.org'
          - (oldap_import_email_backend | default('console') | lower) == 'smtp'
        fail_msg: >-
          Production ZIP imports require the public FasnachtsPage URL, the
          public and internal HTTPS media URLs, and SMTP import notifications.
      when: inventory_hostname in groups['oldap_prod']

    - name: Validate production ZIP-export integration
      ansible.builtin.assert:
        that:
          - (oldap_public_app_url | default('')) == 'https://fasnacht.digital'
          - (oldap_media_export_url | default('')) == 'https://media.oldap.org'
          - (oldap_export_email_backend | default('console') | lower) == 'smtp'
        fail_msg: >-
          Production ZIP exports require the FasnachtsPage status URL, the
          canonical HTTPS media-export URL, and SMTP notifications.
      when: inventory_hostname in groups['oldap_prod']

    - name: Debug inventory_hostname und caddy_mode
      ansible.builtin.debug:
        msg: "Running on {{ inventory_hostname }} with caddy_mode={{ caddy_mode | default('NOT SET') }}"

  tasks:
    - name: Warn if oldap-api is deployed with latest tag
      ansible.builtin.debug:
        msg: "⚠️ WARNING: oldap-api is running with 'latest' tag. This may cause non-reproducible deployments!"
      when: oldap_api_tag is not defined or oldap_api_tag == "latest"

    - name: Warn if oldap-app is deployed with latest tag
      ansible.builtin.debug:
        msg: "⚠️ WARNING: oldap-app is running with 'latest' tag. This may cause non-reproducible deployments!"
      when: oldap_app_tag is not defined or oldap_app_tag == "latest"

    - name: Warn if oldap-harvesters is deployed with latest tag
      ansible.builtin.debug:
        msg: "⚠️ WARNING: oldap-harvesters is running with 'latest' tag. This may cause non-reproducible deployments!"
      when: oldap_harvesters_tag is not defined or oldap_harvesters_tag == "latest"

    - name: Ensure firewall allows HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"

    # Preparation must never install/restart Docker and revive stopped containers.
    - name: Provision Docker host during ordinary deployment only
      when: oldap_deploy_phase == 'deploy'
      block:
        # 0. Remove any old Docker repo definitions that might be broken
        - name: Remove old Docker apt sources
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/docker.list
            state: absent

        # 1. Install prerequisites for Docker (from Ubuntu repo only)
        - name: Install base prerequisites (from Ubuntu repo)
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present
            update_cache: yes

        # 2. Ensure keyrings directory exists
        - name: Ensure /etc/apt/keyrings exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        # 3. Download Docker GPG key
        - name: Download Docker GPG key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'

        # 4. Add Docker apt repository
        - name: Add Docker apt repository
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
            filename: docker

        # 5. Install Docker packages
        - name: Install Docker packages
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: yes

        # 6. Ensure Docker service is running
        - name: Ensure Docker is running
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true

    # 7a. Create directories for OLDAP
    - name: Ensure OLDAP deployment directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ deploy_root }}"
        - "{{ deploy_root }}/compose"
        - "{{ env_dir }}"
        - /opt/oldap/caddy
        - /srv/storage
        - "{{ graphdb_home }}"
        - "{{ graphdb_home }}/conf"
        - /srv/storage/oldap-app

    - name: Ensure oldap-api subdirectories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: 101
        group: 101
        mode: "0755"
      loop:
        - "{{ oldap_data }}/oldap-api"
        - "{{ oldap_data }}/oldap-api/upload"
        - "{{ oldap_data }}/oldap-api/tmp"
        - "{{ oldap_data }}/oldap-app"

    - name: Ensure oldap-harvesters directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ oldap_harvesters_root }}"
          mode: "0755"
        - path: "{{ oldap_harvesters_secrets }}"
          mode: "0700"
        - path: "{{ oldap_harvesters_logs }}"
          mode: "0777"

    # 17. Ensure graphdb-init directory exists
    - name: Ensure graphdb-init directory exists
      ansible.builtin.file:
        path: /opt/oldap/graphdb-init
        state: directory
        owner: root
        group: root
        mode: '0755'

    # 7b. Copy GraphDB license to server
    - name: Copy GraphDB license to server
      ansible.builtin.copy:
        src: ./graphdb.license
        dest: "{{ graphdb_home }}/conf/graphdb.license"
        owner: root
        group: root
        mode: '0644'

    # 19. Copy initial TRIG files
    - name: Copy initial TRIG files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{graphdb_init}}/{{ item | basename }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - files/admin.trig
        - files/oldap.trig
        - files/shared.trig
        - files/dcterms.ttl
        - files/schemaorg.ttl
        - files/skos.ttl

    # 8. Add your user to the docker group
    - name: Ensure user is in docker group
      ansible.builtin.user:
        name: rosenth
        groups: docker
        append: yes

    # 9. Verify docker installation
    - name: Check Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    # 10. Bring up the stack
    - name: Show Docker version
      ansible.builtin.debug:
        msg: "Docker is installed: {{ docker_version.stdout }}"

    # 11. Copy docker-compose.yml and Caddyfile (if you need them)
    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: ./docker-compose.yml
        dest: "{{ compose_dir }}/docker-compose.yml"
        mode: "0644"

    # 12. Render Caddyfile (if you need it)
    - name: Render Caddyfile
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: "{{ compose_dir }}/Caddyfile"
        mode: "0644"

    # 12.1. Ensure Caddy directories exist
    - name: Ensure Caddy directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ caddy_data }}"
        - "{{ caddy_conf }}"

    - name: Render oldap-harvesters config
      ansible.builtin.template:
        src: templates/harvesters.toml.j2
        dest: "{{ oldap_harvesters_config }}"
        owner: root
        group: root
        mode: "0644"

    - name: Write oldap-harvesters Europeana API key from Ansible secret
      ansible.builtin.copy:
        content: "{{ oldap_harvesters_europeana_api_key }}\n"
        dest: "{{ oldap_harvesters_secrets }}/europeana.key"
        owner: root
        group: root
        mode: "0600"
      when: oldap_harvesters_europeana_api_key is defined
      no_log: true

    - name: Write oldap-harvesters OLDAP password from Ansible secret
      ansible.builtin.copy:
        content: "{{ oldap_harvesters_oldap_password }}\n"
        dest: "{{ oldap_harvesters_secrets }}/oldap.password"
        owner: root
        group: root
        mode: "0600"
      when: oldap_harvesters_oldap_password is defined
      no_log: true

    - name: Inspect existing writer deployment before changing topology
      ansible.builtin.stat:
        path: "{{ env_dir }}/archive-writer-provisioned"
      register: existing_writer_owner

    - name: Refuse accidental removal of a provisioned writer owner
      ansible.builtin.assert:
        that:
          - not existing_writer_owner.stat.exists or (oldap_writer_enabled | bool and inventory_hostname == oldap_writer_owner)
        fail_msg: "An existing writer owner requires an explicit maintenance migration before disabling or moving it."

    - name: Inspect existing writer client contract
      ansible.builtin.stat:
        path: "{{ env_dir }}/archive-writer-client-contract"
      register: existing_writer_client

    - name: Read existing writer client contract
      ansible.builtin.slurp:
        src: "{{ env_dir }}/archive-writer-client-contract"
      register: existing_writer_contract
      when: existing_writer_client.stat.exists

    - name: Refuse accidental writer disablement or endpoint migration
      ansible.builtin.assert:
        that:
          - oldap_writer_enabled | bool
          - (existing_writer_contract.content | b64decode) == ([oldap_writer_domain, oldap_writer_owner, oldap_writer_hostname, oldap_writer_port | string, oldap_writer_graphdb_url, oldap_writer_repository] | join(' '))
        fail_msg: "Changing a provisioned coordination domain requires maintenance recovery, not an ordinary redeployment."
      when: existing_writer_client.stat.exists

    - name: Configure dedicated archive writer coordination
      ansible.builtin.include_tasks: tasks/writer-store.yml
      when: oldap_writer_enabled | bool

    # 13. Render .env file
    - name: Render .env
      ansible.builtin.template:
        src: templates/oldap.env.j2
        dest: "{{ compose_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Validate rendered Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ compose_dir }}"
      changed_when: false
      no_log: true

    - name: Start the designated writer store before application writers
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        services: [archive-writer]
        state: present
        wait: true
        wait_timeout: 60
      when: oldap_writer_enabled | bool and inventory_hostname == oldap_writer_owner and not rollback | bool

    - name: Verify storage from each participating writer image
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - run
          - --rm
          - --no-deps
          - --entrypoint
          - python
          - "{{ item }}"
          - /run/oldap-writer-client/check-writer-store.py
        chdir: "{{ compose_dir }}"
      loop: [oldap-api, oldap-tools, oldap-harvesters]
      changed_when: false
      no_log: true
      when: oldap_writer_enabled | bool and not rollback | bool

    # 14. Rollback or Bring up the stack
    - name: Rollback stack (stop + remove containers)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: absent
      when: rollback | bool

    - name: Bring stack up (pull images, create/update containers)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: present
        pull: "{{ 'always' if (app_env == 'Dev' or force_pull | bool) else 'missing' }}"
        remove_orphans: true
      when: not rollback | bool and oldap_deploy_phase == 'deploy'

    - name: Verify installed operator before first application activation
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --pull
          - never
          - --name
          - oldap-operator-activation-check
          - --network
          - compose_default
          - --read-only
          - --cap-drop
          - ALL
          - --security-opt
          - no-new-privileges
          - --mount
          - type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock
          - --mount
          - type=bind,src=/etc/oldap/writer-operator,dst=/run/oldap-operator,readonly
          - --entrypoint
          - python
          - sha256:7319daf2b708a16043adb02e2dcb1ef5967b3cf5950da10a4372763e09616dac
          - /run/oldap-operator/check-production-operator.py
          - "{{ oldap_writer_recovery_inventory_sha256 }}"
      changed_when: false
      when: oldap_deploy_phase == 'activate'

    - name: Start prepared applications after verified migration
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        services: [oldap-api, oldap-app, fasnachts-page]
        dependencies: false
        state: present
        pull: missing
        remove_orphans: false
        wait: true
        wait_timeout: 180
      when: oldap_deploy_phase == 'activate'

    # 15. Show running containers
    - name: Show running containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ compose_dir }}"
      changed_when: false
      register: compose_result
      when: not rollback | bool and oldap_deploy_phase in ['deploy', 'activate']

    - name: Wait for the deployed OLDAP API health endpoint
      ansible.builtin.uri:
        url: "{{ public_api_url }}/health"
        method: GET
        status_code: 200
        timeout: 10
        validate_certs: "{{ inventory_hostname in groups['oldap_prod'] }}"
      register: oldap_api_health
      until: oldap_api_health.status == 200
      retries: 24
      delay: 5
      when: not rollback | bool and oldap_deploy_phase in ['deploy', 'activate']

    - name: Verify ZIP export service account authentication
      ansible.builtin.uri:
        url: "{{ public_api_url }}/mobile/v1/auth/login"
        method: POST
        body_format: json
        body:
          userId: "{{ oldap_export_service_user }}"
          password: "{{ oldap_export_service_password }}"
        status_code: 200
        timeout: 15
        validate_certs: "{{ inventory_hostname in groups['oldap_prod'] }}"
      register: oldap_export_service_login
      until: oldap_export_service_login.status == 200
      retries: 3
      delay: 5
      when: not rollback | bool and oldap_deploy_phase in ['deploy', 'activate']
      no_log: true

    # 16. Show services status
    - name: Print services status
      ansible.builtin.debug:
        var: compose_result
      when: not rollback | bool and oldap_deploy_phase in ['deploy', 'activate']

    # 18. Copy GraphDB repository config file
    - name: Copy GraphDB repo config
      ansible.builtin.copy:
        src: files/oldap-config.ttl
        dest: "{{ graphdb_init }}/oldap-config.ttl"
        owner: root
        group: root
        mode: '0644'

    - name: Confirm preparation left application writers stopped
      ansible.builtin.include_tasks: tasks/require-stopped-writers.yml
      when: oldap_deploy_phase == 'prepare'
