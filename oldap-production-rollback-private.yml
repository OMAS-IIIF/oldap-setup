---
# Pre-opening rollback only: never discard possible public target writes.
# Untouched source storage is retained; full data restore is a different workflow.
- name: Recover the retained GraphDB source after private candidate replacement
  hosts: oldap_prod
  become: true
  gather_facts: false
  vars:
    checkpoint: '/srv/storage/oldap-cutover-{{ snapshot_id }}'
    media_checkpoint: '/data/oldap-cutover-{{ snapshot_id }}'
    media_host: dhlab-iii.dhlab.unibas.ch
  tasks:
    - ansible.builtin.assert:
        that:
          - ansible_host == 'dhlab-oldap.dhlab.unibas.ch'
          - snapshot_id is match('^[a-zA-Z0-9_-]+$')
          - production_rollback_approved | default(false) | bool
    - name: Refuse rollback after opening intent, even after a partial opening
      ansible.builtin.script: 'scripts/cutover-write-boundary.py {{ checkpoint }} check-rollback'
      args: {executable: python3}
      changed_when: false
    - ansible.builtin.slurp: {src: '{{ checkpoint }}/manifest.json'}
      register: manifest
      no_log: true
    - ansible.builtin.assert:
        that: (manifest.content | b64decode | from_json).status == 'source-frozen'
    - name: Reject public or unknown running writers before changing either host
      ansible.builtin.script: 'scripts/check-production-rollback-boundary.py {{ item.role }}'
      args: {executable: python3}
      loop:
        - {role: api, host: dhlab-oldap.dhlab.unibas.ch}
        - {role: media, host: '{{ media_host }}'}
      delegate_to: '{{ item.host }}'
      changed_when: false
    - name: Drain only the admitted private clients, then native storage
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json,subprocess
            names=subprocess.check_output(['docker','ps','--format','{% raw %}{{.Names}}{% endraw %}'],text=True).split()
            for name in ['oldap-api','compose-oldap-jena-identity-1','compose-oldap-jena-1','redis']:
                if name in names: subprocess.run(['docker','stop','--timeout','-1',name],check=True)
    - name: Provide the same verified pair manifest to the media restore
      ansible.builtin.copy:
        dest: '{{ media_checkpoint }}/manifest.json'
        content: '{{ manifest.content | b64decode }}'
        mode: '0600'
      delegate_to: '{{ media_host }}'
      no_log: true
    - name: Restore original Compose files only, never overwrite retained data
      ansible.builtin.script: 'scripts/restore-production-compose.py {{ item.role }} {{ item.path }}'
      args: {executable: python3}
      loop:
        - {role: api, host: dhlab-oldap.dhlab.unibas.ch, path: '{{ checkpoint }}'}
        - {role: media, host: '{{ media_host }}', path: '{{ media_checkpoint }}'}
      delegate_to: '{{ item.host }}'
      no_log: true
    - name: Recreate source API containers with exact saved image identities
      ansible.builtin.command: 'docker compose -p compose -f {{ checkpoint }}/source-compose.json up --no-start --no-deps --pull never graphdb redis archive-writer oldap-api caddy oldap-app fasnachts-page salsah-2'
      no_log: true
    - name: Recreate source media containers without opening writers
      ansible.builtin.command: 'docker compose -p compose -f {{ media_checkpoint }}/source-compose.json up --no-start --no-deps --pull never imageserver mediaserver ingest-worker export-worker mobile-media-worker caddy'
      delegate_to: '{{ media_host }}'
      no_log: true
    - ansible.builtin.slurp: {src: '{{ checkpoint }}/source-state.json'}
      register: saved_state
      no_log: true
    - ansible.builtin.set_fact:
        original: '{{ saved_state.content | b64decode | from_json }}'
      no_log: true
    - ansible.builtin.set_fact:
        source_api: {stdout: '{{ original.api | to_json }}'}
        source_media: {stdout: '{{ original.media | to_json }}'}
        source_recreated: true
        source_timers:
          results:
            - {item: oldap-backup.timer, stdout: '{{ original.timers[0] }}'}
            - {item: oldap-harvest.timer, stdout: '{{ original.timers[1] }}'}
    - name: Verify pinned images and recover the original dependency order
      ansible.builtin.include_tasks: tasks/production-source-resume.yml
    - ansible.builtin.copy:
        dest: '{{ checkpoint }}/source-recovered-after-private.json'
        content: '{"status":"source-recovered","boundary":"before-target-opening","data_restore":false}'
        mode: '0600'
