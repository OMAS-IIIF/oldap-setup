
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    # Persisting is optional; keep it so cache survives restarts (can be removed if you want ephemeral)
    volumes:
      - ${REDIS_DATA:-./redis-data}:/data
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    restart: unless-stopped

  graphdb:
    image: ontotext/graphdb:11.3.0
    container_name: graphdb
    ports:
      - "7200:7200"
    restart: unless-stopped
    volumes:
      - ${GRAPHDB_HOME:-./graphdb-home}:/opt/graphdb/home

  graphdb-init:
    image: curlimages/curl:8.9.0
    depends_on:
      - graphdb
    networks:
      - default
    volumes:
      - ${GRAPHDB_INIT:-./files}:/init
    entrypoint: sh
    command:
      - -c
      - |
        echo 'Waiting for GraphDB...'
        until curl -s http://graphdb:7200/rest/repositories >/dev/null; do
          sleep 5
        done
        if ! curl -s http://graphdb:7200/rest/repositories | grep -q '"id":"oldap"'; then
          echo 'Creating repository oldap...'
          curl -X POST -H 'Content-Type: multipart/form-data' \
               -F config=@/init/oldap-config.ttl \
               http://graphdb:7200/rest/repositories
          echo 'Loading initial TRIG files...'
          for f in /init/*.trig; do
            echo "Loading $$f"
            curl -X POST -H 'Content-Type: application/x-trig' \
                 --data-binary @$$f \
                 http://graphdb:7200/repositories/oldap/statements
          done
        
          echo 'Loading SKOS ontology...'
          curl -X POST \
            -H 'Content-Type: text/turtle' \
            --data-binary @/init/skos.ttl \
            'http://graphdb:7200/repositories/oldap/statements?context=%3Curn:oldap:vocab:skos%3E'
          
          echo 'Loading DCTERMS ontology...'
          curl -X POST \
            -H 'Content-Type: text/turtle' \
            --data-binary @/init/dcterms.ttl \
            'http://graphdb:7200/repositories/oldap/statements?context=%3Curn:oldap:vocab:dcterms%3E'
          
          echo 'Loading SCHEMA:ORG ontology...'
          curl -X POST \
            -H 'Content-Type: text/turtle' \
            --data-binary @/init/schemaorg.ttl \
            'http://graphdb:7200/repositories/oldap/statements?context=%3Curn:oldap:vocab:schema%3E'
        else
          echo 'Repository oldap already exists, skipping init.'
        fi
    restart: "no"


  oldap-api:
    image: lrosenth/oldap-api:${OLDAP_API_TAG:-latest}
    container_name: oldap-api
    depends_on:
      - graphdb
      - redis
    environment:
      OLDAP_ACCESS_JWT_SECRET: ${OLDAP_ACCESS_JWT_SECRET:?OLDAP_ACCESS_JWT_SECRET is required}
      OLDAP_REFRESH_JWT_SECRET: ${OLDAP_REFRESH_JWT_SECRET:?OLDAP_REFRESH_JWT_SECRET is required}
      OLDAP_MEDIA_JWT_SECRET: ${OLDAP_MEDIA_JWT_SECRET:?OLDAP_MEDIA_JWT_SECRET is required}
      OLDAP_PASSWORD_RESET_JWT_SECRET: ${OLDAP_PASSWORD_RESET_JWT_SECRET:?OLDAP_PASSWORD_RESET_JWT_SECRET is required}
      OLDAP_IMPORT_UPLOAD_JWT_SECRET: ${OLDAP_IMPORT_UPLOAD_JWT_SECRET:?OLDAP_IMPORT_UPLOAD_JWT_SECRET is required}
      OLDAP_IMPORT_SERVICE_JWT_SECRET: ${OLDAP_IMPORT_SERVICE_JWT_SECRET:?OLDAP_IMPORT_SERVICE_JWT_SECRET is required}
      OLDAP_IMPORT_RECORDS_JWT_SECRET: ${OLDAP_IMPORT_RECORDS_JWT_SECRET:?OLDAP_IMPORT_RECORDS_JWT_SECRET is required}
      OLDAP_ACCESS_TOKEN_TTL_SECONDS: ${OLDAP_ACCESS_TOKEN_TTL_SECONDS:-900}
      OLDAP_REFRESH_TOKEN_TTL_SECONDS: ${OLDAP_REFRESH_TOKEN_TTL_SECONDS:-1209600}
      OLDAP_MEDIA_TOKEN_TTL_SECONDS: ${OLDAP_MEDIA_TOKEN_TTL_SECONDS:-3600}
      OLDAP_JWT_ISSUER: ${OLDAP_JWT_ISSUER:-https://oldap.org}
      OLDAP_JWT_AUDIENCE: ${OLDAP_JWT_AUDIENCE:-oldap-api}
      OLDAP_AUTH_ADMIN_USER: ${OLDAP_AUTH_ADMIN_USER:?OLDAP_AUTH_ADMIN_USER is required}
      OLDAP_AUTH_ADMIN_PASSWORD: ${OLDAP_AUTH_ADMIN_PASSWORD:?OLDAP_AUTH_ADMIN_PASSWORD is required}
      OLDAP_AUTH_ALLOWED_ORIGINS: ${OLDAP_AUTH_ALLOWED_ORIGINS:?OLDAP_AUTH_ALLOWED_ORIGINS is required}
      OLDAP_REFRESH_COOKIE_NAME: ${OLDAP_REFRESH_COOKIE_NAME:-oldap_refresh}
      OLDAP_REFRESH_COOKIE_SECURE: ${OLDAP_REFRESH_COOKIE_SECURE:-true}
      OLDAP_REFRESH_COOKIE_SAMESITE: ${OLDAP_REFRESH_COOKIE_SAMESITE:-Lax}
      OLDAP_PASSWORD_RESET_ADMIN_USER: ${OLDAP_PASSWORD_RESET_ADMIN_USER:?OLDAP_PASSWORD_RESET_ADMIN_USER is required}
      OLDAP_PASSWORD_RESET_ADMIN_PASSWORD: ${OLDAP_PASSWORD_RESET_ADMIN_PASSWORD:?OLDAP_PASSWORD_RESET_ADMIN_PASSWORD is required}
      OLDAP_IMPORT_SERVICE_USER: ${OLDAP_IMPORT_SERVICE_USER:?OLDAP_IMPORT_SERVICE_USER is required}
      OLDAP_IMPORT_SERVICE_PASSWORD: ${OLDAP_IMPORT_SERVICE_PASSWORD:?OLDAP_IMPORT_SERVICE_PASSWORD is required}
      OLDAP_MEDIA_INGEST_URL: ${OLDAP_MEDIA_INGEST_URL:?OLDAP_MEDIA_INGEST_URL is required}
      OLDAP_MEDIA_INTERNAL_URL: ${OLDAP_MEDIA_INTERNAL_URL:-}
      OLDAP_PASSWORD_RESET_FRONTEND_URL: ${OLDAP_PASSWORD_RESET_FRONTEND_URL:?OLDAP_PASSWORD_RESET_FRONTEND_URL is required}
      OLDAP_PUBLIC_APP_URL: ${OLDAP_PUBLIC_APP_URL:?OLDAP_PUBLIC_APP_URL is required}
      OLDAP_PASSWORD_RESET_EMAIL_BACKEND: ${OLDAP_PASSWORD_RESET_EMAIL_BACKEND:-console}
      OLDAP_IMPORT_EMAIL_BACKEND: ${OLDAP_IMPORT_EMAIL_BACKEND:-console}
      OLDAP_MAIL_HOST: ${OLDAP_MAIL_HOST:-}
      OLDAP_MAIL_PORT: ${OLDAP_MAIL_PORT:-587}
      OLDAP_MAIL_FROM: ${OLDAP_MAIL_FROM:-}
      OLDAP_MAIL_USERNAME: ${OLDAP_MAIL_USERNAME:-}
      OLDAP_MAIL_PASSWORD: ${OLDAP_MAIL_PASSWORD:-}
      OLDAP_MAIL_USE_TLS: ${OLDAP_MAIL_USE_TLS:-true}
      OLDAP_TS_SERVER: http://graphdb:7200
      OLDAP_TS_REPO: oldap
      OLDAP_REDIS_URL: redis://redis:6379
      OLDAP_API_PORT: 8000
      APP_ENV: ${APP_ENV:-Dev}
      UPLOAD_FOLDER: /data/upload
      TMP_FOLDER: /data/tmp
    volumes:
      - ${OLDAP_DATA:-./data}/oldap-api:/data
    expose:
      - 8000
    restart: unless-stopped

  oldap-tools:
    image: lrosenth/oldap-tools:${OLDAP_TOOLS_TAG:-latest}
    container_name: oldap-tools
    profiles: ["tools"]
    depends_on:
      - graphdb
      - redis
    environment:
      OLDAP_REDIS_URL: redis://redis:6379
      GRAPHDB_USER: ${GRAPHDB_USER:-}
      GRAPHDB_PASSWORD: ${GRAPHDB_PASSWORD:-}
    volumes:
      - ${OLDAP_DATA:-./data}/backups:/backups
    restart: "no"

  oldap-harvesters:
    image: lrosenth/oldap-harvesters:${OLDAP_HARVESTERS_TAG:-latest}
    container_name: oldap-harvesters
    profiles: ["tools", "harvesters"]
    depends_on:
      - graphdb
      - redis
    environment:
      OLDAP_REDIS_URL: redis://redis:6379
    command: ["--config", "/app/harvesters.toml", "--write-oldap"]
    volumes:
      - ${OLDAP_HARVESTERS_CONFIG:-./oldap-harvesters/harvesters.toml}:/app/harvesters.toml:ro
      - ${OLDAP_HARVESTERS_SECRETS:-./oldap-harvesters/secrets}:/run/secrets/oldap-harvesters:ro
      - ${OLDAP_HARVESTERS_LOGS:-./oldap-harvesters/logs}:/var/log/oldap-harvesters
    restart: "no"

  oldap-app:
    image: lrosenth/oldap-app:${OLDAP_APP_TAG:-latest}
    container_name: oldap-app
    expose:
      - 3000
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      SERVER_API_URL: ${SERVER_API_URL:-http://oldap-api:8000}
      PUBLIC_IIIF_URL: ${PUBLIC_IIIF_URL}
      PUBLIC_UPLOAD_URL: ${PUBLIC_UPLOAD_URL}
      PUBLIC_MEDIASERVER_URL: ${PUBLIC_MEDIASERVER_URL}
    depends_on:
      - oldap-api
    volumes:
      - ${OLDAP_DATA:-./data}/oldap-app:/data
    restart: unless-stopped

  fasnachts-page:
    image: lrosenth/fasnachts-page:${FASNACHTS_PAGE_TAG:-latest}
    container_name: fasnachts-page
    expose:
      - 3100
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      SERVER_API_URL: ${SERVER_API_URL:-http://oldap-api:8000}
      PUBLIC_IIIF_URL: ${PUBLIC_IIIF_URL}
      PUBLIC_UPLOAD_URL: ${PUBLIC_UPLOAD_URL}
      PUBLIC_MEDIASERVER_URL: ${PUBLIC_MEDIASERVER_URL}
    depends_on:
      - oldap-api
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    container_name: caddy
    environment:
      CADDY_MODE: ${CADDY_MODE:-dev}
      GRAPHDB_BASIC_USER: ${GRAPHDB_BASIC_USER:-admin}
      GRAPHDB_BASIC_HASH: ${GRAPHDB_BASIC_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA}:/data
      - ${CADDY_CONF}:/config
    depends_on:
      - oldap-api
      - oldap-app
      - fasnachts-page
    restart: unless-stopped
