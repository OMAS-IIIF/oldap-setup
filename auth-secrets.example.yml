---
# Copy this file to auth-secrets.yml (ignored by Git) or encrypt an equivalent
# vars file with Ansible Vault. Generate each JWT key independently, for
# example with: openssl rand -hex 32
oldap_access_jwt_secret: ""
oldap_refresh_jwt_secret: ""
oldap_media_jwt_secret: ""
oldap_password_reset_jwt_secret: ""
oldap_import_upload_jwt_secret: ""
oldap_import_service_jwt_secret: ""
oldap_import_records_jwt_secret: ""
oldap_export_service_jwt_secret: ""
oldap_export_download_jwt_secret: ""

# Credentials for an active OLDAP service account able to read users and
# atomically revoke authentication. Password-reset credentials default to this
# account unless separate values are supplied.
oldap_auth_admin_user: ""
oldap_auth_admin_password: ""

# Dedicated OLDAP identity used by the ZIP-import service when it accesses
# project data. Do not reuse a human account in production.
oldap_import_service_user: ""
oldap_import_service_password: ""

# Dedicated OLDAP identity used by the project-neutral ZIP-export service.
oldap_export_service_user: ""
oldap_export_service_password: ""

# Optional separate password-reset service account.
# oldap_password_reset_admin_user: ""
# oldap_password_reset_admin_password: ""
