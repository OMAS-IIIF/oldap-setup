---
# fasnacht.digital is cross-site with api.oldap.org. The secure refresh cookie
# must therefore opt into cross-site requests for the production group only.
oldap_refresh_cookie_secure: true
oldap_refresh_cookie_samesite: "None"

# Password-reset delivery through the University of Basel SMTP relay. The
# production host is trusted by network location, so no SMTP credentials are
# configured or stored in Ansible Vault.
oldap_password_reset_email_backend: "smtp"
oldap_import_email_backend: "smtp"
oldap_mail_host: "smtp.unibas.ch"
oldap_mail_port: 25
oldap_mail_from: "lukas.rosenthaler@unibas.ch"
oldap_mail_use_tls: true
