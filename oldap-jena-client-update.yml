---
# Update the already active home API and independent identity consumer only.
# The Jena namespace owner, data, policy overlays and signing keys stay in place.
- name: Update tested Jena clients on home
  hosts: oldap_home
  become: true
  vars:
    ansible_become_exe: /usr/bin/sudo.ws
    rollout_stamp: '{{ ansible_facts["date_time"]["iso8601_basic_short"] }}'
    rollout_lock_unit: 'oldap-client-update-{{ rollout_stamp }}'
    rollout_ready: '/run/oldap-client-update-{{ rollout_stamp }}.ready'
    rollout_backup: '/opt/oldap/compose/.env.before-client-update-{{ rollout_stamp }}'
  tasks:
    - name: Require home and explicit immutable candidate images
      ansible.builtin.assert:
        that:
          - ansible_host == 'api.home.org'
          - oldap_jena_api_image is match('^lrosenth/oldap-api@sha256:[a-f0-9]{64}$')
          - oldap_jena_tools_image is match('^lrosenth/oldap-tools@sha256:[a-f0-9]{64}$')
    - name: Require the existing Jena backend
      ansible.builtin.command:
        argv: [docker, exec, oldap-api, python, -c, 'import os; assert os.environ["OLDAP_BACKEND"] == "jena"']
      changed_when: false
    # Resolve both immutable images before modifying the live selection. A registry
    # failure must leave the existing environment and running clients untouched.
    - name: Pull both exact candidate images before changing live configuration
      ansible.builtin.command:
        argv: [docker, image, pull, '{{ item }}']
      loop:
        - '{{ oldap_jena_api_image }}'
        - '{{ oldap_jena_tools_image }}'
      changed_when: true
      no_log: true
    - name: Install reviewed lock holder
      ansible.builtin.copy:
        src: scripts/hold-production-cutover-lock.py
        dest: /usr/local/lib/oldap/hold-client-update-lock.py
        mode: '0755'
    - name: Hold namespace recovery during the scoped client replacement
      ansible.builtin.command:
        argv: [systemd-run, '--unit={{ rollout_lock_unit }}', --property=RuntimeMaxSec=600, /usr/bin/python3, /usr/local/lib/oldap/hold-client-update-lock.py, /var/lib/oldap-jena-recovery/lock, '{{ rollout_ready }}']
      changed_when: true
    - name: Replace clients under maintenance ownership
      block:
        - name: Require actual maintenance ownership
          ansible.builtin.wait_for:
            path: '{{ rollout_ready }}'
            timeout: 10
        - name: Capture unchanged namespace owner
          ansible.builtin.command:
            argv: [docker, inspect, --format, '{{ "{{.Id}}" }}', compose-oldap-jena-1]
          register: namespace_before
          changed_when: false
        - name: Preserve installed environment before client update
          ansible.builtin.copy:
            remote_src: true
            src: /opt/oldap/compose/.env
            dest: '{{ rollout_backup }}'
            force: false
            mode: '0600'
          no_log: true
        - name: Select tested client images without replacing other settings
          ansible.builtin.lineinfile:
            path: /opt/oldap/compose/.env
            regexp: '^{{ item.key }}='
            line: '{{ item.key }}={{ item.value }}'
            mode: '0600'
          loop:
            - {key: OLDAP_JENA_API_IMAGE, value: '{{ oldap_jena_api_image }}'}
            - {key: OLDAP_JENA_TOOLS_IMAGE, value: '{{ oldap_jena_tools_image }}'}
          no_log: true
        - name: Update independent identity verification first
          ansible.builtin.command: docker compose up -d --no-deps --wait oldap-jena-identity
          args: {chdir: /opt/oldap/compose}
          changed_when: true
          no_log: true
        - name: Update API without restarting namespace owner or storage
          ansible.builtin.command: docker compose up -d --no-deps --wait oldap-api
          args: {chdir: /opt/oldap/compose}
          changed_when: true
          no_log: true
        - name: Require unchanged namespace owner and ready backend
          ansible.builtin.command:
            argv: [docker, exec, oldap-api, python, -c, 'from urllib.request import urlopen; assert urlopen("http://127.0.0.1:3031/health",timeout=5).read().strip()==b"ready"']
          changed_when: false
        - name: Compare namespace identity after client replacement
          ansible.builtin.command:
            argv: [docker, inspect, --format, '{{ "{{.Id}}" }}', compose-oldap-jena-1]
          register: namespace_after
          changed_when: false
          failed_when: namespace_after.stdout != namespace_before.stdout
      rescue:
        - name: Check whether rollback configuration was retained
          ansible.builtin.stat:
            path: '{{ rollout_backup }}'
          register: rollback_state
        - name: Restore preceding selection after an activation failure
          when: rollback_state.stat.exists
          block:
            - ansible.builtin.copy:
                remote_src: true
                src: '{{ rollout_backup }}'
                dest: /opt/oldap/compose/.env
                mode: '0600'
              no_log: true
            - ansible.builtin.command: docker compose up -d --no-deps --wait oldap-jena-identity oldap-api
              args: {chdir: /opt/oldap/compose}
              no_log: true
        - ansible.builtin.fail:
            msg: Client activation failed; any retained preceding selection was restored.
      always:
        - name: Release only this rollout's maintenance ownership
          ansible.builtin.command:
            argv: [systemctl, stop, '{{ rollout_lock_unit }}']
          changed_when: true
