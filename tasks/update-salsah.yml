---
# Runs against installed configuration only; no dependency or infrastructure startup.
- name: Require an explicit SALSAH release
  ansible.builtin.assert:
    that: salsah_tag is match('^v[0-9]+[.][0-9]+[.][0-9]+$')
- name: Validate installed SALSAH service
  ansible.builtin.command:
    cmd: docker compose config --services
    chdir: "{{ compose_dir }}"
  register: salsah_services
  changed_when: false
- name: Require initial SALSAH installation
  ansible.builtin.assert:
    that: "'salsah-2' in salsah_services.stdout_lines"
    fail_msg: Run the documented SALSAH installation before routine updates.
- name: Pull SALSAH before changing its installed tag
  ansible.builtin.command:
    cmd: docker compose pull salsah-2
    chdir: "{{ compose_dir }}"
  environment:
    SALSAH_TAG: "{{ salsah_tag }}"
  changed_when: true
- name: Save installed configuration for rollback
  ansible.builtin.copy:
    src: "{{ compose_dir }}/.env"
    dest: "{{ compose_dir }}/.env.before-salsah-{{ ansible_date_time.iso8601_basic_short }}"
    remote_src: true
    mode: '0600'
  no_log: true
- name: Persist SALSAH release only
  ansible.builtin.lineinfile:
    path: "{{ compose_dir }}/.env"
    regexp: '^SALSAH_TAG='
    line: "SALSAH_TAG={{ salsah_tag }}"
    mode: '0600'
  no_log: true
- name: Update SALSAH without restarting any other service
  community.docker.docker_compose_v2:
    project_src: "{{ compose_dir }}"
    services: [salsah-2]
    dependencies: false
    remove_orphans: false
    state: present
    wait: true
    wait_timeout: 180
