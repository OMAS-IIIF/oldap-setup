---
# Explicitly disruptive HOME acceptance. Ingress and writers remain closed during
# both faults. No uncertain write replay or batch restart is performed.
- name: Verify automatic Jena recovery with quiesced home writers
  hosts: oldap_home
  become: true
  vars:
    ansible_become_exe: /usr/bin/sudo.ws
    media_host: media.home.org
    media_writers: [oldap-mediahelper, oldap-ingest-worker, oldap-export-worker, oldap-mobile-media-worker]
    mobile_stop_signal: SIGTERM
  tasks:
    - name: Require explicit fault-test selection on home
      ansible.builtin.assert:
        that:
          - ansible_host == 'api.home.org'
          - allow_home_recovery_faults | default(false) | bool
    - name: Inventory API containers before disruptive acceptance
      ansible.builtin.command: docker ps --format '{{ "{{.Names}}" }}'
      register: api_running
      changed_when: false
    - name: Inventory media containers before disruptive acceptance
      ansible.builtin.command: docker ps --format '{{ "{{.Names}}" }}'
      delegate_to: '{{ media_host }}'
      register: media_running
      changed_when: false
    - name: Refuse unknown writers or an incomplete stack
      ansible.builtin.assert:
        that:
          - api_running.stdout_lines | difference(['compose-salsah-2-1']) | sort == ['oldap-api', 'compose-oldap-jena-1', 'compose-oldap-jena-identity-1', 'redis', 'caddy', 'fasnachts-page', 'oldap-app'] | sort
          - media_running.stdout_lines | sort == (media_writers + ['oldap-imageserver', 'oldap-media-caddy']) | sort
    - name: Install explicit fault probe
      ansible.builtin.copy:
        src: scripts/check-jena-recovery.py
        dest: /usr/local/lib/oldap/check-jena-recovery.py
        mode: '0700'
    - name: Test maintenance exclusion and automatic recovery with ingress closed
      block:
        - name: Pause recovery using the shared lock
          ansible.builtin.command: /usr/bin/python3 /usr/local/lib/oldap/jena-recovery.py pause
        - name: Verify a periodic check is inert during maintenance
          ansible.builtin.command: /usr/bin/python3 /usr/local/lib/oldap/jena-recovery.py check
          changed_when: false
        - name: Quiesce ingress and media writers while API remains available
          ansible.builtin.include_tasks: tasks/jena-home-quiesce.yml
        - name: Enable automatic recovery for the isolated fault checks
          ansible.builtin.command: /usr/bin/python3 /usr/local/lib/oldap/jena-recovery.py resume
        - name: Let Docker and the timer recover two backend faults
          ansible.builtin.command: /usr/bin/python3 /usr/local/lib/oldap/check-jena-recovery.py
          register: recovery_check
        - name: Store sanitized acceptance evidence on the host
          ansible.builtin.copy:
            dest: /var/lib/oldap-jena-recovery/acceptance.json
            content: '{{ recovery_check.stdout }}'
            mode: '0644'
        - name: Reopen API ingress after successful automatic recovery
          ansible.builtin.command: docker start caddy
        - name: Resume media writers
          ansible.builtin.command:
            argv: '{{ ["docker", "start"] + media_writers }}'
          delegate_to: '{{ media_host }}'
        - name: Reopen media ingress
          ansible.builtin.command: docker start oldap-media-caddy
          delegate_to: '{{ media_host }}'
      rescue:
        - name: Pause automatic recovery before manual fallback
          ansible.builtin.command: /usr/bin/python3 /usr/local/lib/oldap/jena-recovery.py pause
        - name: Recover the existing stack with the established coordinated procedure
          ansible.builtin.include_tasks: tasks/jena-home-start.yml
        - name: Report failed automatic acceptance after restoring service
          ansible.builtin.fail:
            msg: Automatic recovery acceptance failed; coordinated manual recovery restored service. Inspect the private test log.
